<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/cart.css">

    <title>Cart</title>
</head>
<body>
    <body>
  <!-- NAV BAR -->
  <header class="nav">
    <h2>Fruit Veggie House</h2>
    <div class="cart-icon">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-count">0</span>
    </div>
  </header>

  <!-- CART PAGE WRAPPER -->
  <section class="cart-page">

    <h1>Your Cart</h1>


    
    <div class="cart-items-container">
<div class="cart-item">
    <img src="images/apples.jpg" alt="Apples">

    <div class="item-info">
        <h3>Apples</h3>
        <p class="price">UGX 5,000</p>
    </div>

    <div class="item-quantity">
        <button class="qty-btn minus">-</button>
        <span class="qty-number">1</span>
        <button class="qty-btn plus">+</button>
    </div>

    <button class="remove-item">Remove</button>
</div>




      <!-- Cart items will be injected here with JavaScript -->
    </div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <p>Subtotal: <span class="subtotal">0</span></p>
      <p>Delivery: <span class="delivery">Free</span></p>
      <h2>Total: <span class="total">0</span></h2>

      <button class="checkout-btn">Proceed to Checkout</button>
    </div>

  </section>



</body>

</body>
</html>
